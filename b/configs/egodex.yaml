# EgoDex dataset configuration
debug: false
verbose: false
skip_existing: false
n_processes: 1
data_root_dir: "/mnt/r/DATA/EgoDex/test_phantom"
processed_data_root_dir: "/mnt/r/DATA/EgoDex/test_phantom_processed"
demo_name: ""

# Processing settings
mode: ["bbox"]
demo_num: null

# Additional settings
debug_cameras: []

# EgoDex-specific settings
input_resolution: 1080
output_resolution: 1080
robot: "Kinova3"
gripper: "Robotiq85"
square: false
epic: true
bimanual_setup: "shoulders"
target_hand: "both"
constrained_hand: false
depth_for_overlay: false
render: false
camera_intrinsics: "camera/camera_intrinsics_egodex.json"
camera_extrinsics: "camera/camera_extrinsics_ego_bimanual_shoulders.json"

# Hand inpainting (ProPainter CLI in a separate conda env; e2fgvi is rollback)
inpaint_backend: propainter
propainter_root: "/home/a26160/SRC/ProPainter"
propainter_python: ""   # required for propainter; or set env PROPAINTER_PYTHON
propainter_fp16: true
propainter_subvideo_length: 80
propainter_neighbor_length: 10
propainter_ref_stride: 10
# Downscale before inpaint to save GPU memory. 0 = native frame size.
inpaint_resolution: 480

# Mask dilation (larger = more aggressive hand removal)
# At 480p inpaint resolution, kernel 11 with 3 iterations ≈ 15px effective dilation
mask_dilate_kernel: "MORPH_ELLIPSE"
mask_dilate_size: 11
mask_dilate_iterations: 3
