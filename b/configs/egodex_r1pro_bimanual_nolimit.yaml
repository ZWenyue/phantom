# EgoDex — R1 Pro bimanual WITHOUT arm joint limits (simulation experiment).
# Reuses smoothed_actions_*_r1pro.npz; outputs *_r1pro_nolimit.*.
# Not for real-robot transfer — limits match physical hardware.
debug: false
verbose: false
skip_existing: false
n_processes: 1
data_root_dir: "/mnt/r/DATA/EgoDex/test_phantom"
processed_data_root_dir: "/mnt/r/DATA/EgoDex/test_phantom_processed"
demo_name: ""

# Processing settings
mode: ["bbox"]
demo_num: null

# Additional settings
debug_cameras: []

# R1 Pro bimanual (no joint limits)
input_resolution: 1080
output_resolution: 1080
robot: "R1ProRightArm"
gripper: "R1Pro"
square: false
epic: true
bimanual_setup: "r1pro_nolimit"
# Push L/R EE targets apart for wider overlay look (0 = exact hand tracking).
# Sandwich hands are ~25 cm apart; ~0.12 m spread approaches Kinova-style open gap.
ee_lateral_spread: 0.0
target_hand: "both"
constrained_hand: false
depth_for_overlay: false
render: false
camera_intrinsics: "camera/camera_intrinsics_egodex.json"
camera_extrinsics: "camera/camera_extrinsics_ego_bimanual_shoulders.json"

# Hand inpainting settings
inpaint_backend: propainter
propainter_root: "/home/a26160/SRC/ProPainter"
propainter_python: ""
propainter_fp16: true
propainter_subvideo_length: 80
propainter_neighbor_length: 10
propainter_ref_stride: 10
inpaint_resolution: 480

# Mask dilation
mask_dilate_kernel: "MORPH_ELLIPSE"
mask_dilate_size: 11
mask_dilate_iterations: 3
