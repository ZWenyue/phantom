# EgoDex basic_pick_place — contact-grounded intent smoke (demo 0)
#
# Prerequisites:
#   1) DA3 depth.npy in the processed demo dir
#   2) python b/export_egodex_objects.py --task basic_pick_place
#   3) python b/export_egodex_hand_gt.py --task basic_pick_place --demo 0 --overwrite
#
# Usage (from phantom/phantom):
#   python process_data.py --config-path=../b/configs \
#       --config-name=egodex_panda_intent mode=intent demo_num=0
debug: true
verbose: true
skip_existing: false
n_processes: 1
data_root_dir: "/home/a26160/DATA/test_phantom"
processed_data_root_dir: "/home/a26160/DATA/test_phantom_processed"
demo_name: "egodex_basic_pick_place"

mode: ["intent"]
demo_num: 0

debug_cameras: []

input_resolution: 1080
output_resolution: 1080
robot: "Panda"
gripper: "Robotiq85"
square: false
epic: true
bimanual_setup: "single_arm"
target_hand: "right"
constrained_hand: false
depth_for_overlay: false
render: false
camera_intrinsics: "camera/camera_intrinsics_egodex.json"
camera_extrinsics: "camera/camera_extrinsics_ego_bimanual_shoulders.json"

# object_prompt is optional with intent_track_backend=hand_sam2 (hand-anchored).
# Kept as a YOLO fallback if GT hands are missing.
object_prompt: "black stapler"
intent_dino_threshold: 0.01     # YOLO-World scores are much lower than Grounding-DINO
intent_yolo_model: "/home/a26160/SRC/phantom/yolov8x-worldv2.pt"
intent_seed_stride: 3
intent_seed_min_score: 0.01
intent_seed_prefer_dark: auto   # prompt has black/dark → rank YOLO boxes by dark-pixel fraction
intent_seed_dark_luma: 60
intent_seed_score_keep: 0.2     # only re-rank boxes with score >= this * top score
intent_seed_tighten_dark: true  # shrink the seed box to the dark core before SAM
intent_track_backend: hand_sam2  # hand_sam2 (default) | yolo
intent_seed_grounding: auto      # auto: VLM in-hand box then geom; vlm | geom
intent_seed_detector: owlv2      # owlv2 (stronger on rare nouns, e.g. macaron) | yolo
intent_seed_approach_window: 8   # frames before seed used as "approach" speed (v1 fallback)
intent_seed_hold_window: 8       # frames after seed used as "hold" speed (v1 fallback)
intent_seed_move_vel: 0.01       # m/frame; fingertip speed floor for moving-hand frames
intent_seed_move_run: 4          # min consecutive moving frames to count as a moving run
intent_seed_global_stride: 5     # v3: sample candidates across ALL moving-hand runs
intent_seed_cand_k: 5            # v2 equally spaced in one window; unused by v3 (stride instead)
intent_seed_probe_win: 8         # ±frames of SAM2 video used to score each candidate
intent_hand_dilate_px: 25        # GT-keypoint skeleton/palm dilation for the hand region
intent_track_hand_overlap_max: 0.5  # |mask ∩ hand| / |mask|; above → reject candidate / QA fail
intent_track_static_bonus_w: 0.3 # probe score += w * static_bonus (still-then-move vs always-still)
intent_track_min_disp: 0.05      # m; grasp/transport net object displacement below this → QA fail
intent_track_max_area_frac: 0.20 # reject seed masks larger than this fraction of the image
intent_track_neg_exclude_px: 28  # don't put SAM negatives this close to the pinch centre
intent_track_reseed_max: 2       # extra hand-conditioned seeds if video track fails the gate
intent_track_motion_corr_min: 0.3  # in-hand corr(obj_vel, tip_vel); below → QA fail
intent_track_static_vel_max: 0.02  # m/frame; free-phase object speed above this → drift
intent_track_attach_err_max: 0.06  # m; |obj_t − (obj_{t-1}+Δtip)| above this → not attached
intent_track_stride: 1       # YOLO+SAM every frame; hold on miss (yolo backend)
intent_track_iou: 0.15       # IoU(prev mask, box) to keep instance; else re-id by YOLO score
intent_track_hand_px: 200    # jump to a box whose centre is within this many px of target-hand tips
intent_track_max_area_ratio: 3.5  # ignore YOLO boxes much larger than the previous mask
intent_track_jump_px: 120    # no-overlap re-id only if the box is this close to the prev mask centroid
intent_use_T_camera: auto    # per-frame HDF5 T_camera → stable world, then T_calib@t0
intent_T_camera_ref: 0
intent_T_camera_convention: opencv
intent_place_workspace: auto   # T_place: frozen EgoDex world → Panda workspace (in front of base)
intent_place_target: [0.50, 0.00, 0.05]  # robot-frame location of the grasp-hand at grasp_kf
intent_grasp_offset: hand      # contact-segment p_t* offset from hand midpoint (else object G*)
intent_reuse_masks: true     # reuse object_masks.npy; skip YOLO/SAM when only T_camera changed
egodex_root: "/home/a26160/DATA/test"
egodex_task: "basic_pick_place"
intent_depth_max: 3.0
intent_min_object_pts: 50
intent_centroid_smooth_win: 5      # temporal moving-average width on centroid target track
intent_centroid_reject_m: 0.05     # reject centroid frames >5cm from local median (small-obj depth jitter)

intent_contact_dist_in: 0.03
intent_contact_dist_out: 0.05
intent_contact_xy_inflate: 0.06  # wrap: |Δz| if nearest visible point is within 6 cm XY
intent_contact_min_valid: 5
intent_contact_min_run: 3
intent_contact_motion_thresh: 0.004
intent_grasp_window: 3
intent_release_window: 3

intent_grasp_precontact_window: 8
intent_grasp_approach_frames: 4
intent_gripper_max_width: 0.08
intent_grasp_antipodal_pct: 2.0

intent_wp_free: 1.0
intent_wr_free: 0.1
intent_wp_grasp: 5.0
intent_wr_grasp: 2.5

stageb_warm_start: true
stageb_grip_rot_offset_deg: 90.0
stageb_ori_scale: 0.2
stageb_w_smooth: 1.0
stageb_w_reg: 0.01
stageb_w_vel: 0.0
stageb_dq_max: 0.3
stageb_max_nfev: 2000            # 200 hits the cap on T=160 (success=False, ~13s)

retarget_use_depth: false
retarget_key_pos_thresh: 0.03
retarget_vel_thresh: 0.5
retarget_jerk_thresh: 0.05
retarget_frame_pos_thresh: 0.05
